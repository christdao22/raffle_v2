services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: raffle_v2
      POSTGRES_PASSWORD: raffle_v2
      POSTGRES_DB: raffle_v2
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raffle_v2"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

